name: Install .NET SDK
description: Install the current GA LTS and STS .NET SDKs and optionally the current preview/go-live SDK.
inputs:
  versionPrecision:
    description: Precision used to match installed SDKs (major, minor, or patch). Default is major; patch requires the exact latest resolved SDK version.
    required: false
    default: 'major'
  includePreview:
    description: Whether to include preview/go-live .NET SDK versions or not. Default is to exclude preview versions.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - id: resolveSdkPlan
    name: Resolve required .NET SDK versions
    shell: pwsh
    env:
      CB_DOTNET_VERSION_PRECISION: ${{ inputs.versionPrecision }}
    run: |
      Set-StrictMode -Version Latest
      $ErrorActionPreference = 'Stop'

      $versionPrecision = $env:CB_DOTNET_VERSION_PRECISION
      if ($versionPrecision -notin @('major', 'minor', 'patch')) {
        throw 'versionPrecision must be one of: major, minor, patch.'
      }

      function Test-SdkVersionMatch {
        param([string] $InstalledVersion, [string] $RequiredVersion)

        if ($versionPrecision -eq 'patch') {
          return $InstalledVersion -eq $RequiredVersion
        }

        $installedSdk = [System.Management.Automation.SemanticVersion]$InstalledVersion
        $requiredSdk = [System.Management.Automation.SemanticVersion]$RequiredVersion
        if ([string]::IsNullOrEmpty($installedSdk.PreReleaseLabel) -ne [string]::IsNullOrEmpty($requiredSdk.PreReleaseLabel)) {
          return $false
        }
        if ($installedSdk.Major -ne $requiredSdk.Major) {
          return $false
        }
        return $versionPrecision -eq 'major' -or $installedSdk.Minor -eq $requiredSdk.Minor
      }

      $previewSupportPhases = @('preview', 'go-live')
      $includePreview = '${{ inputs.includePreview }}' -eq 'true'

      $releaseIndex = Invoke-RestMethod -Uri 'https://raw.githubusercontent.com/dotnet/core/main/release-notes/releases-index.json'
      $candidateChannels = @(
        $releaseIndex.'releases-index' |
          Where-Object {
            $_.product -eq '.NET' -and
            $_.'release-type' -in @('lts', 'sts') -and
            -not [string]::IsNullOrWhiteSpace($_.'latest-sdk')
          } |
          Sort-Object { [Version]($_.'channel-version') }
      )

      $stableChannels = @(
        $candidateChannels |
          Where-Object {
            $_.'support-phase' -ne 'eol' -and
            $_.'support-phase' -notin $previewSupportPhases
          }
      )

      $currentLtsChannel = @(
        $stableChannels |
          Where-Object { $_.'release-type' -eq 'lts' } |
          Sort-Object { [Version]($_.'channel-version') }
      ) | Select-Object -Last 1

      $currentStsChannel = @(
        $stableChannels |
          Where-Object { $_.'release-type' -eq 'sts' } |
          Sort-Object { [Version]($_.'channel-version') }
      ) | Select-Object -Last 1

      if ($null -eq $currentLtsChannel -and $null -eq $currentStsChannel) {
        throw 'Unable to resolve the current GA LTS or STS .NET SDK from releases-index.json.'
      }

      $requiredChannels = [System.Collections.Generic.List[object]]::new()
      if ($null -ne $currentLtsChannel) { $requiredChannels.Add($currentLtsChannel) }
      if ($null -ne $currentStsChannel) { $requiredChannels.Add($currentStsChannel) }

      $previewChannel = $null
      if ($includePreview) {
        $previewChannel = @(
          $candidateChannels |
            Where-Object { $_.'support-phase' -in $previewSupportPhases } |
            Sort-Object { [Version]($_.'channel-version') }
        ) | Select-Object -Last 1

        if ($null -ne $previewChannel) {
          $requiredChannels.Add($previewChannel)
        }
      }

      $requiredVersions = @(
        $requiredChannels |
          ForEach-Object { $_.'latest-sdk' } |
          Select-Object -Unique
      )

      $installedVersions = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
      $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
      if ($null -ne $dotnet) {
        $sdkLines = @(& dotnet --list-sdks)
        if ($LASTEXITCODE -ne 0) {
          throw "dotnet --list-sdks failed with exit code $LASTEXITCODE. Check the runner's .NET installation before retrying."
        }
        foreach ($line in $sdkLines) {
          if ($line -match '^(?<version>\S+)\s+\[.+\]$') {
            [void]$installedVersions.Add($Matches.version)
          }
        }
      }

      $missingVersions = [System.Collections.Generic.List[string]]::new()
      $presentVersions = [System.Collections.Generic.List[string]]::new()
      foreach ($requiredVersion in $requiredVersions) {
        $matchingVersions = @(
          $installedVersions |
            Where-Object { Test-SdkVersionMatch -InstalledVersion $_ -RequiredVersion $requiredVersion } |
            Sort-Object { [System.Management.Automation.SemanticVersion]$_ } -Descending
        )
        if ($matchingVersions.Count -eq 0) {
          $missingVersions.Add($requiredVersion)
        } else {
          $presentVersions.Add($matchingVersions[0])
        }
      }

      Write-Host "Version precision: $versionPrecision"
      Write-Host 'Resolved required .NET SDKs:'
      if ($null -ne $currentLtsChannel) {
        Write-Host " - current LTS: $($currentLtsChannel.'channel-version') [$($currentLtsChannel.'support-phase')] => $($currentLtsChannel.'latest-sdk')"
      }
      if ($null -ne $currentStsChannel) {
        Write-Host " - current STS: $($currentStsChannel.'channel-version') [$($currentStsChannel.'support-phase')] => $($currentStsChannel.'latest-sdk')"
      }
      if ($null -ne $previewChannel) {
        Write-Host " - preview/go-live: $($previewChannel.'channel-version') [$($previewChannel.'support-phase')] => $($previewChannel.'latest-sdk')"
      }

      if ($presentVersions.Count -gt 0) {
        Write-Host "Already installed matching SDKs: $($presentVersions -join ', ')"
      }

      if ($missingVersions.Count -eq 0) {
        Write-Host 'All required .NET SDKs are already installed.'
        'missingVersions=' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Append
      } else {
        Write-Host "Missing SDKs to install: $($missingVersions -join ', ')"

        $delimiter = [Guid]::NewGuid().ToString('N')
        "missingVersions<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Append
        $missingVersions | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Append
        $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Append
      }
  - if: steps.resolveSdkPlan.outputs.missingVersions != ''
    name: Install missing .NET SDKs
    uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    with:
      dotnet-version: ${{ steps.resolveSdkPlan.outputs.missingVersions }}
branding:
  icon: 'umbrella'
  color: 'blue'
